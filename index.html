<style>
  :root{
    --cream:#fbf6ee; --paper:#ffffff; --ink:#13233f; --muted:#5e6b82;
    --cobalt:#3257f0; --cobalt-dk:#2542c4; --amber:#ffb300; --coral:#ff5d73; --green:#1faf6b;
    --line:#ece4d4; --shadow:0 14px 34px -18px rgba(28,40,80,.34);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    color:var(--ink); background:var(--cream);
    background-image:radial-gradient(circle at 12% -5%, rgba(50,87,240,.08), transparent 40%),
                     radial-gradient(circle at 92% 4%, rgba(255,179,0,.12), transparent 38%);
    line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:var(--cobalt)}
  h1,h2,h3,.fred{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.2px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* top bar */
  header.bar{position:sticky;top:0;z-index:30;background:rgba(251,246,238,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar-in{display:flex;align-items:center;gap:12px;padding:12px 20px;max-width:1080px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:11px;cursor:pointer;border:0;background:none;padding:0}
  .logo .mark{width:40px;height:40px;border-radius:12px;background:var(--cobalt);position:relative;flex:none;box-shadow:0 6px 14px -6px rgba(50,87,240,.7)}
  .logo .mark::before{content:"";position:absolute;left:9px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--amber)}
  .logo .mark::after{content:"";position:absolute;left:14px;top:25px;width:12px;height:8px;border-radius:3px;background:#e7dec8}
  .logo b{font-family:'Fredoka',sans-serif;font-size:21px;color:var(--cobalt);font-weight:700}
  .logo span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:-3px;letter-spacing:.3px}
  .bar-sp{flex:1}
  .ghost{border:1.5px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
  .ghost:hover{border-color:var(--cobalt);color:var(--cobalt)}

  main{padding:14px 0 60px}
  /* hero */
  .hero{text-align:center;padding:34px 0 10px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);color:var(--cobalt);font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:999px;text-transform:uppercase;letter-spacing:1px}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}
  .hero h1{font-size:clamp(31px,6vw,52px);line-height:1.05;margin:18px 0 8px}
  .hero h1 .hl{color:var(--cobalt)}
  .hero p.lead{max-width:680px;margin:0 auto;color:var(--muted);font-size:clamp(15px,2.4vw,18px)}
  .hero .meta{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .chip b{color:var(--cobalt)}

  .sec-h{display:flex;align-items:baseline;gap:12px;margin:38px 0 16px}
  .sec-h h2{font-size:clamp(20px,3.6vw,27px);margin:0}
  .sec-h .sub{color:var(--muted);font-size:14px;font-weight:600}

  /* class grid */
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  .card{position:relative;border:0;text-align:left;background:var(--paper);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;padding:0;transition:transform .15s ease,box-shadow .15s ease;opacity:0;transform:translateY(10px);animation:rise .5s forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -20px rgba(28,40,80,.45)}
  .card .top{height:96px;display:flex;align-items:center;justify-content:center;position:relative}
  .card .top .rn{font-family:'Fredoka',sans-serif;font-weight:700;font-size:44px;color:#fff;text-shadow:0 4px 10px rgba(0,0,0,.18)}
  .card .top .bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.18)}
  .card .body{padding:13px 15px 15px}
  .card .body .nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px}
  .card .body .ds{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tag{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--green)}
  .tag.soon{color:#a07b1d}

  /* subject cards */
  .subj{display:flex;align-items:center;gap:14px;padding:16px}
  .subj .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
  .subj .nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px}
  .subj .ds{font-size:12.5px;color:var(--muted)}
  .card.locked{cursor:not-allowed;filter:saturate(.55)}
  .card.locked:hover{transform:none;box-shadow:var(--shadow)}

  /* breadcrumb */
  .crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted);margin:6px 0 4px;flex-wrap:wrap}
  .crumb button{border:0;background:none;color:var(--cobalt);font:inherit;font-weight:700;cursor:pointer;padding:0}
  .crumb .arr{color:#c9bfa9}

  /* setup */
  .panel{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;max-width:560px;margin:8px auto}
  .panel h2{margin:0 0 4px;font-size:24px}
  .panel .pm{color:var(--muted);font-size:14px;margin-bottom:18px}
  .opt-row{margin:16px 0}
  .opt-row .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:74px;border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:11px 8px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;border-radius:14px;background:var(--cobalt);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:15px;cursor:pointer;margin-top:18px;box-shadow:0 12px 24px -12px var(--cobalt);font-family:'Fredoka',sans-serif}
  .btn:hover{background:var(--cobalt-dk)}
  .btn.amber{background:var(--amber);color:#3a2c00;box-shadow:0 12px 24px -12px var(--amber)}
  .btn.ghost2{background:#fff;color:var(--cobalt);border:1.5px solid var(--line);box-shadow:none}

  /* quiz */
  .q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink)}
  .bar-track{height:9px;background:#efe7d7;border-radius:999px;overflow:hidden;margin-bottom:6px}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--cobalt),var(--amber));width:0;transition:width .35s ease}
  .combo{font-weight:700;color:var(--coral);font-size:13px;min-height:18px;text-align:right}
  .qcard{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-top:8px}
  .qnum{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--cobalt)}
  .qtext{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(20px,3.4vw,25px);line-height:1.3;margin:6px 0 18px}
  .answers{display:grid;gap:11px}
  .ans{display:flex;align-items:center;gap:13px;border:2px solid var(--line);background:var(--cream);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s,transform .08s}
  .ans:hover:not(:disabled){border-color:var(--cobalt)}
  .ans:active:not(:disabled){transform:scale(.99)}
  .ans .key{width:28px;height:28px;border-radius:8px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;color:var(--muted)}
  .ans.correct{border-color:var(--green);background:#e9f9f0}
  .ans.correct .key{background:var(--green);color:#fff;border-color:var(--green)}
  .ans.wrong{border-color:var(--coral);background:#fdecef}
  .ans.wrong .key{background:var(--coral);color:#fff;border-color:var(--coral)}
  .ans:disabled{cursor:default}
  .explain{margin-top:16px;background:#f3f6ff;border-left:4px solid var(--cobalt);border-radius:10px;padding:13px 15px;font-size:14.5px;color:#33415c;display:none}
  .explain.show{display:block;animation:rise .3s}
  .explain b{color:var(--cobalt)}
  .q-foot{margin-top:18px;display:flex;justify-content:flex-end}

  /* result */
  .result{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 24px;text-align:center;max-width:520px;margin:8px auto}
  .ring{--p:0;width:150px;height:150px;border-radius:50%;margin:4px auto 12px;background:conic-gradient(var(--cobalt) calc(var(--p)*1%),#eadfca 0);display:flex;align-items:center;justify-content:center}
  .ring .in{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-family:'Fredoka',sans-serif;font-size:34px;line-height:1;color:var(--ink)}
  .ring .in span{font-size:12px;color:var(--muted);font-weight:600}
  .rank{font-family:'Fredoka',sans-serif;font-size:25px;margin:4px 0}
  .rmsg{color:var(--muted);font-size:15px;margin-bottom:8px}
  .res-btns{display:grid;gap:10px;margin-top:18px}
  .copied{font-size:13px;color:var(--green);font-weight:700;min-height:18px;margin-top:6px}

  /* about */
  .about{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:14px}
  .ab{background:var(--paper);border-radius:16px;border:1px solid var(--line);padding:18px}
  .ab h3{margin:0 0 6px;font-size:17px;color:var(--cobalt)}
  .ab p{margin:0;font-size:14px;color:var(--muted)}

  footer{border-top:1px solid var(--line);margin-top:46px;padding:26px 0 40px;text-align:center;color:var(--muted);font-size:13.5px}
  footer .built{font-weight:600;color:var(--ink)}
  footer a{font-weight:700;text-decoration:none}
  footer .small{font-size:12px;margin-top:6px}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
  @media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.panel,.qcard{padding:18px}}
</style>
</head>

   QUIZ GYAN — class-wise CBSE quiz hub
   No database, no paid API. Pure client-side. Deploy as index.html.

   To add a class/subject: add a "<class>_<subject>" array to BANKS below.
   ============================================================ */

/* ---- CBSE class & subject map (Class I to XI) ---- */
const SUBJECTS = {
  science:{name:"Science",icon:"\u269b\ufe0f",c:"#3257f0"},
  maths:{name:"Maths",icon:"\u2797",c:"#ff5d73"},
  geography:{name:"Geography",icon:"\ud83c\udf0d",c:"#1faf6b"},
  history:{name:"History",icon:"\ud83c\udfdb\ufe0f",c:"#b56a16"},
  civics:{name:"Civics",icon:"\u2696\ufe0f",c:"#7b54d3"},
  economics:{name:"Economics",icon:"\ud83d\udcc8",c:"#0d9488"},
  evs:{name:"EVS",icon:"\ud83c\udf31",c:"#1faf6b"},
  english:{name:"English",icon:"\u270f\ufe0f",c:"#e08a00"},
  gk:{name:"GK",icon:"\ud83d\udca1",c:"#3257f0"},

  biology:{name:"Biology",icon:"\ud83e\uddec",c:"#ff5d73"},
  accountancy:{name:"Accountancy",icon:"\ud83d\udcca",c:"#b56a16"},
  "political-science":{name:"Political Science",icon:"\ud83c\udfdb\ufe0f",c:"#7b54d3"}
};
const CLASSES = [
  {id:"1",roman:"I",subjects:["maths","english","gk"]},
  {id:"2",roman:"II",subjects:["maths","english","gk"]},
  {id:"3",roman:"III",subjects:["maths","evs","english","gk"]},
  {id:"4",roman:"IV",subjects:["maths","evs","english","gk"]},
  {id:"5",roman:"V",subjects:["maths","evs","english","gk"]},
  {id:"6",roman:"VI",subjects:["science","maths","geography","history","civics"]},
  {id:"7",roman:"VII",subjects:["science","maths","geography","history","civics"]},
  {id:"8",roman:"VIII",subjects:["science","maths","geography","history","civics"]},
  {id:"9",roman:"IX",subjects:["science","maths","history","geography","civics","economics"]},
  {id:"10",roman:"X",subjects:["science","maths","history","geography","civics","economics"]},
  {id:"11",roman:"XI",subjects:["physics","chemistry","biology","maths","accountancy","economics","history","political-science"]}
];
const CLASS_GRAD = ["#3257f0,#5b7bff","#ff5d73,#ff8aa0","#1faf6b,#42c98a","#b56a16,#e0a64a","#7b54d3,#a07ee8","#0d9488,#2fb3a6","#e0007a,#ff5db0","#2b6cb0,#4f9fe0","#d97706,#f5b23b","#0891b2,#22c3e6","#6d28d9,#9a6cf0"];
function className(id){ return "Class "+(CLASSES.find(c=>c.id===id)||{roman:id}).roman; }

/* ============================================================
   QUESTION BANKS  ("<classId>_<subject>")
   Each: {d:"easy|medium|hard", q, a (correct), w:[3 wrong], e (why)}
   ============================================================ */
const BANKS = {
/* ---------------- CLASS VII ---------------- */
"7_science":[
{d:"easy",q:"Green plants prepare their own food by which process?",a:"Photosynthesis",w:["Respiration","Digestion","Excretion"],e:"Green plants make food by photosynthesis using sunlight, water and carbon dioxide."},
{d:"easy",q:"Which green pigment in leaves traps sunlight to make food?",a:"Chlorophyll",w:["Haemoglobin","Melanin","Carotene"],e:"Chlorophyll absorbs light energy for photosynthesis."},

{d:"medium",q:"The tiny pores on a leaf's surface used for exchange of gases are called?",a:"Stomata",w:["Sepals","Nodes","Veins"],e:"Stomata allow gases to move in and out of leaves."},

{d:"hard",q:"Which great mathematician-astronomer of the Gupta age explained the idea of zero?",a:"Aryabhata",w:["Chanakya","Tansen","Kalidasa"],e:"Aryabhata was a famous mathematician and astronomer of the Gupta era."}
]
};

/* ============================================================ ENGINE ============================================================ */
var G={muted:false, cls:null, subject:null, difficulty:"mixed", amount:10, questions:[], idx:0, score:0, combo:0, maxcombo:0, answered:false, challenge:null};
var mem={};
function store(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function fetchKey(k){try{var v=localStorage.getItem(k);return v===null?(k in mem?mem[k]:null):v}catch(e){return (k in mem?mem[k]:null)}}
var app=document.getElementById('app');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function bankKey(cls,sub){return cls+"_"+sub}
function hasBank(cls,sub){var b=BANKS[bankKey(cls,sub)];return !!(b&&b.length)}

/* sounds */
var AC=null;
function beep(type){ if(G.muted)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);var t=AC.currentTime;
  if(type==='ok'){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09);}
  else if(type==='no'){o.frequency.setValueAtTime(200,t);o.frequency.setValueAtTime(150,t+.12);}
  else {o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(784,t+.12);o.frequency.setValueAtTime(1046,t+.24);}
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.42);}catch(e){} }
function toggleMute(){G.muted=!G.muted;document.getElementById('muteBtn').textContent=G.muted?"\ud83d\udd07 Sound off":"\ud83d\udd0a Sound on"}

/* routing */
function go(hash){ if(location.hash===('#'+hash)){route()} else {location.hash=hash?('#'+hash):''} }
function route(){
  var h=location.hash.replace(/^#/,'');
  if(h.indexOf('b=')===0){ openChallenge(h.slice(2)); return; }
  if(h.indexOf('class-')===0){ var id=h.slice(6); if(CLASSES.find(c=>c.id===id)){renderClass(id);return} }
  if(h.indexOf('play-')===0){ var p=h.slice(5).split('-'); if(p.length>=2 && hasBank(p[0],p.slice(1).join('-'))){renderSetup(p[0],p.slice(1).join('-'));return} }
  renderHome();
}
window.addEventListener('hashchange',route);

/* ---------- HOME ---------- */
function renderHome(){
  window.scrollTo(0,0);
  var cards=CLASSES.map(function(c,i){
    var ready=c.subjects.some(function(s){return hasBank(c.id,s)});
    var grad=CLASS_GRAD[i%CLASS_GRAD.length];
    return '<button class="card" style="animation-delay:'+(i*45)+'ms" onclick="go(\'class-'+c.id+'\')">'+
      '<div class="top" style="background:linear-gradient(135deg,'+grad+')">'+
        '<span class="bub" style="width:60px;height:60px;left:12px;top:-14px"></span>'+
        '<span class="bub" style="width:34px;height:34px;right:16px;bottom:8px"></span>'+
        '<span class="rn">'+c.roman+'</span>'+
      '</div>'+
      '<span class="tag '+(ready?'':'soon')+'">'+(ready?'Ready':'Soon')+'</span>'+
      '<div class="body"><div class="nm">Class '+c.roman+'</div><div class="ds">'+c.subjects.length+' subjects</div></div>'+
    '</button>';
  }).join('');
  app.innerHTML=
    '<section class="hero">'+
      '<span class="eyebrow"><span class="dot"></span> CBSE Curriculum • Class I–XI</span>'+
      '<h1>Quiz Gyan — practise <span class="hl">CBSE</span> the fun way</h1>'+
      '<p class="lead">Free, class-wise quizzes for school students. Pick your class and subject, answer bite-size questions, and learn from instant explanations. No sign-up, no cost.</p>'+
      '<div class="meta"><span class="chip"><b>Science</b></span><span class="chip"><b>Maths</b></span><span class="chip"><b>Geography</b></span><span class="chip"><b>History</b></span><span class="chip">&amp; more</span></div>'+
    '</section>'+
    '<div class="sec-h"><h2>Choose your class</h2><span class="sub">Tap a class to see its subjects</span></div>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="sec-h"><h2>Why Quiz Gyan?</h2></div>'+
    '<div class="about">'+
      '<div class="ab"><h3>CBSE aligned</h3><p>Questions follow the CBSE / NCERT syllabus for each class, so they match what you study at school.</p></div>'+
      '<div class="ab"><h3>Learn as you play</h3><p>Every question shows a short explanation, so a wrong answer still teaches you something.</p></div>'+
      '<div class="ab"><h3>Challenge friends</h3><p>Finish a quiz and share a link — your friend plays the exact same questions and tries to beat your score.</p></div>'+
    '</div>';
}

/* ---------- CLASS ---------- */
function renderClass(id){
  window.scrollTo(0,0);
  var c=CLASSES.find(x=>x.id===id);
  var cards=c.subjects.map(function(s,i){
    var meta=SUBJECTS[s]||{name:s,icon:"\ud83d\udcd8",c:"#3257f0"};
    var ready=hasBank(id,s);
    var n=ready?BANKS[bankKey(id,s)].length:0;
    var onclick=ready?(' onclick="go(\'play-'+id+'-'+s+'\')"'):'';
    return '<button class="card '+(ready?'':'locked')+'" style="animation-delay:'+(i*45)+'ms"'+onclick+(ready?'':' disabled')+'>'+
      '<span class="tag '+(ready?'':'soon')+'">'+(ready?'Play':'Soon')+'</span>'+
      '<div class="subj">'+
        '<span class="ic" style="background:'+meta.c+'1a;color:'+meta.c+'">'+meta.icon+'</span>'+
        '<span><span class="nm">'+meta.name+'</span><br><span class="ds">'+(ready?(n+' questions • CBSE'):'Coming soon')+'</span></span>'+
      '</div>'+
    '</button>';
  }).join('');
  var ready=c.subjects.some(function(s){return hasBank(id,s)});
  app.innerHTML=
    '<div class="crumb"><button onclick="go(\'\')">Home</button><span class="arr">›</span><span>Class '+c.roman+'</span></div>'+
    '<div class="sec-h"><h2>Class '+c.roman+' — choose a subject</h2><span class="sub">CBSE curriculum</span></div>'+
    (ready?'':'<p style="color:var(--muted);margin:0 0 14px">Quizzes for this class are being added. The subjects below are part of the plan — check back soon!</p>')+
    '<div class="grid">'+cards+'</div>';
}

/* ---------- SETUP ---------- */
function renderSetup(cls,sub){
  window.scrollTo(0,0);
  G.cls=cls;G.subject=sub;G.difficulty="mixed";G.amount=10;
  var meta=SUBJECTS[sub]; var bank=BANKS[bankKey(cls,sub)];
  var counts={easy:0,medium:0,hard:0}; bank.forEach(function(q){counts[q.d]++});
  app.innerHTML=
    '<div class="crumb"><button onclick="go(\'\')">Home</button><span class="arr">›</span><button onclick="go(\'class-'+cls+'\')">Class '+className(cls).slice(6)+'</button><span class="arr">›</span><span>'+meta.name+'</span></div>'+
    '<div class="panel">'+
      '<h2>'+meta.icon+' Class '+className(cls).slice(6)+' · '+meta.name+'</h2>'+
      '<p class="pm">'+bank.length+' CBSE questions available — '+counts.easy+' easy, '+counts.medium+' medium, '+counts.hard+' hard.</p>'+
      '<div class="opt-row"><div class="lab">Difficulty</div><div class="seg" id="segDiff">'+
        ['mixed','easy','medium','hard'].map(function(d){return '<button class="'+(d==='mixed'?'on':'')+'" data-d="'+d+'" onclick="pickDiff(this)">'+d.charAt(0).toUpperCase()+d.slice(1)+'</button>'}).join('')+
      '</div></div>'+
      '<div class="opt-row"><div class="lab">Number of questions</div><div class="seg" id="segNum">'+
        [5,10].map(function(n){return '<button class="'+(n===10?'on':'')+'" data-n="'+n+'" onclick="pickNum(this)">'+n+' questions</button>'}).join('')+
      '</div></div>'+
      '<button class="btn" onclick="startQuiz()">Start quiz →</button>'+
    '</div>';
}
function pickDiff(b){G.difficulty=b.getAttribute('data-d');[].forEach.call(b.parentNode.children,function(x){x.classList.remove('on')});b.classList.add('on')}
function pickNum(b){G.amount=parseInt(b.getAttribute('data-n'));[].forEach.call(b.parentNode.children,function(x){x.classList.remove('on')});b.classList.add('on')}

/* ---------- build a fresh, non-repeating set (deck rotation) ---------- */
function getQuestions(cls,sub,difficulty,amount){
  var bank=BANKS[bankKey(cls,sub)]||[];
  var pool=difficulty==='mixed'?bank.slice():bank.filter(function(q){return q.d===difficulty});
  if(pool.length===0) pool=bank.slice();
  var key="qg2_"+cls+"_"+sub+"_"+difficulty;
  var deck=[]; try{deck=JSON.parse(fetchKey(key)||"[]")}catch(e){deck=[]}
  if(!Array.isArray(deck)) deck=[];
  var want=Math.min(amount,pool.length);
  if(deck.length<want){ deck=shuffle(pool.map(function(_,i){return i})); }
  var pick=deck.slice(0,want); deck=deck.slice(want);
  store(key,JSON.stringify(deck));
  return pick.map(function(i){ var q=pool[i]; return {q:q.q,a:q.a,e:q.e,options:shuffle([q.a].concat(q.w))}; });
}
function startQuiz(){
  G.questions=getQuestions(G.cls,G.subject,G.difficulty,G.amount);
  G.idx=0;G.score=0;G.combo=0;G.maxcombo=0;G.answered=false;G.challenge=null;
  renderQuiz();
}

/* ---------- QUIZ ---------- */
function renderQuiz(){
  window.scrollTo(0,0);
  var q=G.questions[G.idx];
  var meta=SUBJECTS[G.subject];
  var pct=Math.round((G.idx)/G.questions.length*100);
  var head=G.challenge?('Challenge • '+meta.name):('Class '+className(G.cls).slice(6)+' · '+meta.name);
  app.innerHTML=
    '<div class="q-top"><span class="pill">'+meta.icon+' '+head+'</span><span class="pill">Score '+G.score+'</span></div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="combo">'+(G.combo>1?('\ud83d\udd25 '+G.combo+' in a row!'):'')+'</div>'+
    '<div class="qcard">'+
      '<div class="qnum">Question '+(G.idx+1)+' of '+G.questions.length+'</div>'+
      '<div class="qtext">'+esc(q.q)+'</div>'+
      '<div class="answers" id="answers">'+
        q.options.map(function(opt,i){return '<button class="ans" data-i="'+i+'" onclick="choose('+i+')"><span class="key">'+(i+1)+'</span><span>'+esc(opt)+'</span></button>'}).join('')+
      '</div>'+
      '<div class="explain" id="explain"></div>'+
      '<div class="q-foot" id="qfoot"></div>'+
    '</div>';
}
function choose(i){
  if(G.answered)return; G.answered=true;
  var q=G.questions[G.idx];
  var btns=document.querySelectorAll('#answers .ans');
  var chosen=q.options[i]; var correct=(chosen===q.a);
  btns.forEach(function(b){ b.disabled=true; var opt=q.options[parseInt(b.getAttribute('data-i'))];
    if(opt===q.a)b.classList.add('correct'); else if(parseInt(b.getAttribute('data-i'))===i)b.classList.add('wrong'); });
  if(correct){G.score++;G.combo++;G.maxcombo=Math.max(G.maxcombo,G.combo);beep('ok')} else {G.combo=0;beep('no')}
  var ex=document.getElementById('explain');
  ex.innerHTML='<b>'+(correct?'Correct! ':'Answer: '+esc(q.a)+'. ')+'</b>'+esc(q.e);
  ex.classList.add('show');
  var last=(G.idx===G.questions.length-1);
  document.getElementById('qfoot').innerHTML='<button class="btn" style="width:auto;margin:0;padding:12px 26px" onclick="nextQ()">'+(last?'See result →':'Next →')+'</button>';
}
function nextQ(){ if(G.idx<G.questions.length-1){G.idx++;G.answered=false;renderQuiz();} else {finish();} }

/* ---------- RESULT ---------- */
function rankOf(p){ if(p===100)return["\ud83c\udfc6 Quiz Champion!","A perfect score — outstanding!"]; if(p>=80)return["\ud83c\udf1f Star Scholar","Brilliant work — almost perfect!"]; if(p>=60)return["\ud83d\udc4d Good Job","Nicely done — keep it up!"]; if(p>=40)return["\ud83d\udcda Getting There","A fair try — revise and go again!"]; return["\ud83c\udf31 Keep Practising","Every expert was once a beginner!"]; }
function finish(){
  window.scrollTo(0,0);
  var total=G.questions.length, p=Math.round(G.score/total*100), r=rankOf(p);
  var meta=SUBJECTS[G.subject];
  if(p>=60)confetti();
  if(p>=80)beep('win');
  var vs='';
  if(G.challenge){ var cs=G.challenge.sc, nm=G.challenge.n||'Your friend';
    vs='<div class="rmsg" style="margin-top:10px">'+esc(nm)+' scored <b>'+cs+'/'+total+'</b>. '+(G.score>cs?'You won! \ud83c\udf89':(G.score===cs?'It\u2019s a tie! \ud83e\udd1d':'So close — try again to beat them!'))+'</div>'; }
  app.innerHTML=
    '<div class="result">'+
      '<div class="qnum" style="color:var(--cobalt)">Class '+className(G.cls).slice(6)+' · '+meta.name+'</div>'+
      '<div class="ring" style="--p:'+p+'"><div class="in"><b>'+G.score+'/'+total+'</b><span>'+p+'%</span></div></div>'+
      '<div class="rank">'+r[0]+'</div>'+
      '<div class="rmsg">'+r[1]+(G.maxcombo>2?(' Best streak: '+G.maxcombo+'.'):'')+'</div>'+
      vs+
      '<div class="res-btns">'+
        '<button class="btn amber" onclick="shareChallenge()">\ud83c\udfaf Challenge a friend</button>'+
        '<div class="copied" id="copied"></div>'+
        '<button class="btn" onclick="startQuiz()">\ud83d\udd01 Play again</button>'+
        '<button class="btn ghost2" onclick="go(\'class-'+G.cls+'\')">Pick another subject</button>'+
        '<button class="btn ghost2" onclick="go(\'\')">\ud83c\udfe0 Home</button>'+
      '</div>'+
    '</div>';
}

/* ---------- CHALLENGE (shareable link, no server) ---------- */
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s)))}
function shareChallenge(){
  var payload={v:2,cl:G.cls,sub:G.subject,sc:G.score,n:"",items:G.questions.map(function(q){return {q:q.q,a:q.a,e:q.e,o:q.options}})};
  var link=location.origin+location.pathname+'#b='+b64e(JSON.stringify(payload));
  var msg="I scored "+G.score+"/"+G.questions.length+" on Quiz Gyan ("+ 'Class '+className(G.cls).slice(6)+' '+SUBJECTS[G.subject].name +"). Can you beat me? "+link;
  var c=document.getElementById('copied');
  if(navigator.share){ navigator.share({title:'Quiz Gyan challenge',text:msg,url:link}).catch(function(){copyText(link,c)}); }
  else { copyText(link,c); }
}
function copyText(t,c){ try{navigator.clipboard.writeText(t);c.textContent='Link copied! Send it to a friend \ud83d\udce9';}catch(e){ c.textContent=t; } }
function openChallenge(data){
  window.scrollTo(0,0);
  var p; try{p=JSON.parse(b64d(data))}catch(e){p=null}
  if(!p||!p.items){renderHome();return;}
  G.cls=p.cl;G.subject=p.sub;
  G.questions=p.items.map(function(it){return {q:it.q,a:it.a,e:it.e,options:it.o}});
  G.idx=0;G.score=0;G.combo=0;G.maxcombo=0;G.answered=false;G.challenge={sc:p.sc,n:p.n};
  var meta=SUBJECTS[G.subject]||{name:'Quiz',icon:'\ud83d\udca1'};
  app.innerHTML=
    '<div class="panel" style="text-align:center">'+
      '<div style="font-size:46px">\ud83c\udfaf</div>'+
      '<h2>You\u2019ve been challenged!</h2>'+
      '<p class="pm">Class '+className(G.cls).slice(6)+' · '+meta.name+' — the same '+G.questions.length+' questions. Your friend scored <b>'+p.sc+'/'+G.questions.length+'</b>. Can you beat them?</p>'+
      '<button class="btn" onclick="renderQuiz()">Accept &amp; start →</button>'+
      '<button class="btn ghost2" onclick="go(\'\')">Explore Quiz Gyan instead</button>'+
    '</div>';
}

/* ---------- confetti ---------- */
function confetti(){
  var cols=['#3257f0','#ffb300','#ff5d73','#1faf6b','#7b54d3'];
  var box=document.createElement('div');box.className='confetti';
  for(var i=0;i<70;i++){var s=document.createElement('i');s.style.left=Math.random()*100+'vw';s.style.background=cols[i%cols.length];s.style.animationDuration=(2+Math.random()*1.8)+'s';s.style.animationDelay=(Math.random()*0.5)+'s';s.style.transform='rotate('+(Math.random()*360)+'deg)';box.appendChild(s);}
  document.body.appendChild(box);setTimeout(function(){box.remove()},4200);
}

/* keyboard 1-4 */
document.addEventListener('keydown',function(e){
  if(/^[1-4]$/.test(e.key)){var b=document.querySelector('#answers .ans[data-i="'+(parseInt(e.key)-1)+'"]');if(b&&!b.disabled)b.click();}
  if((e.key==='Enter'||e.key===' ')&&G.answered){var f=document.querySelector('#qfoot .btn');if(f){e.preventDefault();f.click();}}
});

route();
</script>
